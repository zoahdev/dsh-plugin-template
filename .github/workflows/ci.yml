name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test
      - name: Pack
        run: pnpm pack
      - name: Packaged integration + real tool invocation
        run: node scripts/integration-test.mjs ./dsh-plugin-template-0.1.0.tgz
      - name: Fresh DSH profile install + boot smoke
        run: bash scripts/dsh-smoke.sh ./dsh-plugin-template-0.1.0.tgz
